<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year | Countdown | Based On World HNY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/timi.css">

    <style>
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .popup-overlay.hide {
            display: none;
        }
        .popup-box {
            background: linear-gradient(135deg, #860891, #3dc022);
            color: #fff;
            padding: 3rem 4rem;
            border-radius: 1.5rem;
            text-align: center;
            max-width: 90%;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
            animation: popIn 0.5s ease;
        }
        .popup-box h2 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        .popup-box p {
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }
        .popup-box button {
            font-family: 'Poppins', sans-serif;
            font-size: 1.6rem;
            padding: 0.8rem 2.5rem;
            border: none;
            border-radius: 3rem;
            background: #fff;
            color: #860891;
            font-weight: 600;
            cursor: pointer;
        }
        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .time-status {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 100;
            font-size: 1rem;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <!-- Popup -->
    <div class="popup-overlay" id="popup">
        <div class="popup-box">
            <h2>🎉 Happy New Year <span id="popup-year"></span>! 🎉</h2>
            <p>Notun bochhor tomar jibone onek shukh, shanti ar shofolota niye asuk.</p>
            <button id="popup-btn">Start</button>
        </div>
    </div>

    <a href="https://github.com/mejbaul01" target="_blank" style="position: fixed; top: 10px; left: 10px; z-index: 100;">
        <button>ownership of project</button>
    </a>

    <div class="content-wrapper">
        <p class="header">Happy New Year Count Down</p>
        <h1 class="year" id="new-year">0000</h1>
        <div class="timer">
            <div class="timer-box">
                <div class="timer-box__count">
                    <span id="days">0</span>
                </div>
                <div class="timer-box__text">Days</div>
            </div>
            <div class="timer-box">
                <div class="timer-box__count">
                    <span id="hours">0</span>
                </div>
                <div class="timer-box__text">Hours</div>
            </div>
            <div class="timer-box">
                <div class="timer-box__count">
                    <span id="minutes">0</span>
                </div>
                <div class="timer-box__text">Minutes</div>
            </div>
            <div class="timer-box">
                <div class="timer-box__count">
                    <span id="seconds">0</span>
                </div>
                <div class="timer-box__text">Seconds</div>
            </div>
        </div>
    </div>

    <!-- Time status: internet time ache kina dekhay -->
    <p id="time-status" class="time-status"></p>

<audio id="bg-music"
    src="https://res.cloudinary.com/ux0wwihb/video/upload/v1795074503/background.mp3"
    loop preload="auto"></audio>

    <!-- I license by Greenred Productions for 5years. thank you for help me to use this music -->
     <!--I love that music.-->

    <!-- Image-er nam jeta-i hok, assets folder theke load hobe -->
    <div class="fireworks-container"
        style="background-image: url('./assets/new yer.jpg'), url('./assets/new_yer.jpg'), url('./assets/new-year.jpg');"></div>
    <!-- photo by Guo xin Goh on unsplash -->

    <script src="./js/Boom.js"></script>
    <script src="./js/timi.js"></script>

</body>

</html>
